name: pscdp-dev-build

on:
  push:
    branches: [ "dev" ]
    paths-ignore:
      - '**/README.md'
      - '**/.gitignore'
      - 'docs/**'
  pull_request:
    branches: [ "dev" ]
    paths-ignore:
      - '**/README.md'
      - 'docs/**'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['9.0.x' ]

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup .NET SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium

      - name: Check Chromium Version
        run: chromium --version

      - name: Run Chromium
        run: chromium --headless --no-sandbox --disable-gpu --remote-debugging-port=9222 &

      - name: Wait for Chromium
        run: |
          for i in {1..10}; do
            if nc -z localhost 9222; then
              echo "Chromium is up!"
              break
            fi
            echo "Waiting for Chromium..."
            sleep 1
          done

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Debug

      - name: Run Tests (with Chromium)
        run: dotnet test --verbosity normal